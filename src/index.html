<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCT Hub</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, var(--cp-accent-soft), transparent 34rem),
        linear-gradient(180deg, var(--cp-bg-elevated), var(--cp-bg));
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .app {
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      min-height: 100vh;
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 28px 24px;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px;
      border: 1px solid var(--cp-border);
      border-radius: 24px;
      background: var(--cp-panel-strong);
      box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: var(--cp-surface);
      overflow: hidden;
      border: 1px solid var(--cp-border);
      box-shadow: inset 0 0 0 1px var(--cp-sheen);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 56px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--cp-text-muted);
      font-size: clamp(14px, 2vw, 18px);
    }

    .notice {
      display: grid;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-panel);
      color: var(--cp-text);
      font-size: 12px;
      line-height: 1.35;
      box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
    }

    .notice strong {
      color: var(--cp-accent);
    }

    .official-links {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .official-links a {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 7px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface);
      text-decoration: none;
      font-size: 12px;
    }

    .official-links a:hover {
      border-color: var(--cp-accent);
      background: var(--cp-accent-soft);
    }

    .language {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--cp-text-muted);
      font-size: 14px;
    }

    select {
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface);
      color: var(--cp-text);
      font: inherit;
    }

    .chat {
      display: flex;
      flex-direction: column;
      min-height: 420px;
      border: 1px solid var(--cp-border);
      border-radius: 24px;
      background: var(--cp-panel-strong);
      box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
      overflow: hidden;
    }

    .progress {
      position: relative;
      height: 3px;
      margin: 0 0 12px;
      border-radius: 999px;
      background: var(--cp-surface-soft);
      overflow: hidden;
    }

    .progress[hidden] {
      display: none;
    }

    .progress::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      background: var(--cp-accent);
      animation: progress-slide 1.15s ease-in-out infinite;
    }

    @keyframes progress-slide {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(260%);
      }
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px;
    }

    .message {
      display: flex;
      margin: 0 0 16px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(720px, 88%);
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--cp-border);
      background: var(--cp-surface);
      line-height: 1.55;
      box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
    }

    .bubble h3 {
      margin: 4px 0 10px;
      color: var(--cp-text);
      font-size: 16px;
      line-height: 1.35;
    }

    .bubble h4 {
      margin: 12px 0 8px;
      color: var(--cp-text);
      font-size: 15px;
      line-height: 1.35;
    }

    .bubble p {
      margin: 0 0 12px;
    }

    .bubble p:last-child,
    .bubble ul:last-child {
      margin-bottom: 0;
    }

    .bubble ul {
      margin: 0 0 12px;
      padding-left: 22px;
    }

    .bubble li {
      margin: 5px 0;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 12px 0;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface);
    }

    .bubble table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
      font-size: 14px;
    }

    .bubble th,
    .bubble td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--cp-border);
      text-align: left;
      vertical-align: top;
    }

    .bubble th {
      background: var(--cp-accent-soft);
      color: var(--cp-text);
      font-weight: 700;
    }

    .bubble tr:last-child td {
      border-bottom: 0;
    }

    .source-ref {
      margin-top: 8px;
      color: var(--cp-text-muted);
      font-size: 13px;
    }

    .user .bubble {
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      border-color: var(--cp-accent);
    }

    .meta {
      color: var(--cp-text-muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .composer {
      border-top: 1px solid var(--cp-border);
      padding: 18px;
      background: var(--cp-bg-elevated);
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
    }

    .attachment-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      padding: 6px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface);
    }

    .attachment-chip img {
      width: 42px;
      height: 42px;
      border-radius: 0.625rem;
      object-fit: cover;
      border: 1px solid var(--cp-border);
    }

    .attachment-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-accent-soft);
      color: var(--cp-accent);
      font-size: 20px;
    }

    .attachment-name {
      max-width: 220px;
      overflow: hidden;
      color: var(--cp-text-muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-attachment {
      width: 28px;
      height: 28px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface-soft);
      color: var(--cp-text);
      cursor: pointer;
    }

    .paste-hint {
      margin: 0 0 8px;
      color: var(--cp-text-muted);
      font-size: 12px;
    }

    .suggestion,
    .send,
    .reset,
    .attach {
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface);
      color: var(--cp-text);
      font: inherit;
      cursor: pointer;
    }

    .suggestion {
      padding: 8px 10px;
      font-size: 13px;
      transition: background 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
    }

    .suggestion:hover,
    .reset:hover,
    .attach:hover {
      border-color: var(--cp-border-strong);
      background: var(--cp-accent-soft);
    }

    .suggestion:hover {
      transform: translateY(-1px);
    }

    form {
      display: flex;
      gap: 8px;
      padding: 6px;
      border: 1px solid var(--cp-border);
      border-radius: 16px;
      background: var(--cp-surface);
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      padding: 12px;
      border: 1px solid transparent;
      border-radius: 0.625rem;
      background: transparent;
      color: var(--cp-text);
      font: inherit;
    }

    textarea:focus {
      outline: 2px solid var(--cp-accent-soft);
      border-color: var(--cp-accent);
    }

    .send,
    .reset,
    .attach {
      padding: 0 16px;
      min-width: 84px;
      transition: background 0.16s ease, border-color 0.16s ease;
    }

    .send {
      background: var(--cp-accent);
      color: var(--cp-accent-fg);
      border-color: var(--cp-accent);
      font-weight: 600;
    }

    .send:hover {
      background: var(--cp-accent-hover);
    }

    .send:disabled,
    .reset:disabled,
    .attach:disabled,
    textarea:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    input[type="file"].visually-hidden {
      display: none;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--cp-text-muted);
      font-size: 12px;
      padding: 0 6px;
    }

    a {
      color: var(--cp-link);
    }

    @media (max-width: 640px) {
      .app {
        padding: 14px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
        padding: 18px;
      }

      .brand {
        align-items: flex-start;
      }

      .logo {
        width: 52px;
        height: 52px;
        border-radius: 16px;
      }

      form {
        flex-direction: column;
      }

      .send,
      .reset {
        min-height: 42px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="logo">
          <img src="mcthub-logo.png" alt="MCT Hub logo">
        </div>
        <div>
          <h1>MCT Hub</h1>
          <p id="subtitle" class="subtitle"></p>
        </div>
      </div>
      <div class="language">
        <label id="language-label" for="language"></label>
        <select id="language">
          <option value="ko">한국어</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="zh">中文</option>
        </select>
      </div>
    </header>

    <section id="notice" class="notice"></section>

    <section class="chat" aria-label="MCT Hub chat">
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="composer">
        <div id="suggestions" class="suggestions"></div>
        <div id="attachments" class="attachments"></div>
        <p id="paste-hint" class="paste-hint"></p>
        <div id="progress" class="progress" role="progressbar" hidden></div>
        <form id="form">
          <input id="file-input" class="visually-hidden" type="file" accept="image/*,.pdf,.docx,.txt,.md,.csv">
          <button id="attach" class="attach" type="button"></button>
          <textarea id="input" rows="1"></textarea>
          <button id="send" class="send" type="submit"></button>
          <button id="reset" class="reset" type="button"></button>
        </form>
      </div>
    </section>

    <footer>
      <span id="status"></span>
      <span id="footer-note"></span>
    </footer>
  </main>

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function safeHttpUrl(value) {
      try {
        if (/[\s"'<>`]/.test(value) || /&(quot|apos|#0*3[49]|#x0*2[27]);/i.test(value)) return "";
        const url = new URL(value);
        return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
      } catch {
        return "";
      }
    }

    function linkHtml(label, rawUrl) {
      const safeUrl = safeHttpUrl(rawUrl);
      if (!safeUrl) return escapeHtml(label);
      return `<a href="${escapeHtml(safeUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
    }

    function renderInline(value) {
      return escapeHtml(value)
        .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s"'<>`]+)(?:\s+&quot;[^&]*&quot;)?\)/g, (_, label, url) => linkHtml(label, url))
        .replace(/(^|[\s:])(https?:\/\/[^\s"'<>`]+)/g, (_, prefix, url) => `${prefix}${linkHtml(url, url)}`)
        .replace(/`([^`]+)`/g, "<strong>$1</strong>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderMarkdown(value) {
      const normalized = value
        .replace(/\r\n/g, "\n")
        .replace(/([^\n])•\s+/g, "$1\n• ")
        .replace(/([.!?])\s+(\*\*[^*]+\*\*)/g, "$1\n\n$2");
      const lines = normalized.split("\n");
      const html = [];
      let paragraph = [];
      let list = [];
      let table = null;

      const flushParagraph = () => {
        if (!paragraph.length) return;
        html.push(`<p>${paragraph.join(" ")}</p>`);
        paragraph = [];
      };

      const flushList = () => {
        if (!list.length) return;
        html.push(`<ul>${list.map((item) => `<li>${item}</li>`).join("")}</ul>`);
        list = [];
      };

      const splitTableRow = (line) =>
        line.replace(/^\s*\|?|\|?\s*$/g, "").split("|").map((cell) => cell.trim());

      const isTableSeparator = (line) =>
        /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);

      const flushTable = () => {
        if (!table) return;
        const head = table.headers.map((cell) => `<th>${renderInline(cell)}</th>`).join("");
        const body = table.rows.map((row) =>
          `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`
        ).join("");
        html.push(`<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`);
        table = null;
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) {
          flushParagraph();
          flushList();
          flushTable();
          continue;
        }

        if (line.includes("|")) {
          const nextLine = lines[i + 1]?.trim() || "";
          if (!table && isTableSeparator(nextLine)) {
            flushParagraph();
            flushList();
            table = { headers: splitTableRow(line), rows: [] };
            continue;
          }
          if (table) {
            if (isTableSeparator(line)) continue;
            table.rows.push(splitTableRow(line));
            continue;
          }
        }

        flushTable();

        const hashHeading = line.match(/^(#{1,6})\s+(.+?)\s*#*$/);
        if (hashHeading) {
          flushParagraph();
          flushList();
          const tag = hashHeading[1].length <= 2 ? "h3" : "h4";
          html.push(`<${tag}>${renderInline(hashHeading[2])}</${tag}>`);
          continue;
        }

        const emojiHeading = line.match(/^(✅|🔍|📌|📚|⚠️|💡|📝|🎯)\s+(.+)/u);
        if (emojiHeading) {
          flushParagraph();
          flushList();
          html.push(`<h3>${emojiHeading[1]} ${renderInline(emojiHeading[2])}</h3>`);
          continue;
        }

        const httpSource = line.match(/^\[(\d+)\]:\s+(https?:\/\/[^\s"'<>`]+)(?:\s+&quot;([^&]+)&quot;|\s+"([^"]+)")?/);
        if (httpSource) {
          flushParagraph();
          flushList();
          const label = httpSource[3] || httpSource[4] || httpSource[2];
          html.push(`<div class="source-ref">${linkHtml(`[${httpSource[1]}] ${label}`, httpSource[2])}</div>`);
          continue;
        }

        const internalSource = line.match(/^\[(\d+)\]:\s+(?!https?:)(.+)/);
        if (internalSource) {
          flushParagraph();
          flushList();
          const title = internalSource[2].match(/"([^"]+)"\s*$/)?.[1] || "Knowledge source";
          html.push(`<div class="source-ref">[${internalSource[1]}] ${escapeHtml(title)}</div>`);
          continue;
        }

        const bullet = line.match(/^(?:[-*•])\s+(.+)/);
        if (bullet) {
          flushParagraph();
          list.push(renderInline(bullet[1]));
          continue;
        }

        const heading = line.match(/^\*\*([^*]+)\*\*$/);
        if (heading) {
          flushParagraph();
          flushList();
          html.push(`<h3>${escapeHtml(heading[1])}</h3>`);
          continue;
        }

        paragraph.push(renderInline(line));
      }

      flushParagraph();
      flushList();
      flushTable();
      return html.join("");
    }

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("read failed"));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("image failed"));
          img.onload = () => resolve(img);
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function isSupportedFile(file) {
      const lowerName = file.name.toLowerCase();
      return SUPPORTED_EXTENSIONS.some((extension) => lowerName.endsWith(extension)) || SUPPORTED_MIME_TYPES.includes(file.type);
    }

    async function normalizeImageAttachment(file) {
      if (!file.type.startsWith("image/")) {
        throw new Error("not image");
      }

      const image = await fileToImage(file);
      const maxDimension = 1280;
      const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
      const width = Math.max(1, Math.round(image.width * scale));
      const height = Math.max(1, Math.round(image.height * scale));

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      context.drawImage(image, 0, 0, width, height);

      const contentType = file.type === "image/png" && scale === 1 ? "image/png" : "image/jpeg";
      const contentUrl = canvas.toDataURL(contentType, 0.86);
      const extension = contentType === "image/png" ? "png" : "jpg";
      const baseName = file.name && file.name.includes(".") ? file.name.replace(/\.[^.]+$/, "") : (file.name || "pasted-image");

      return {
        id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        name: `${baseName}.${extension}`,
        contentType,
        blob: dataUrlToBlob(contentUrl),
        previewUrl: contentUrl,
        isImage: true
      };
    }

    async function normalizeAttachment(file) {
      if (file.size > MAX_FILE_BYTES) {
        throw new Error("too large");
      }
      if (!isSupportedFile(file)) {
        throw new Error("unsupported");
      }
      if (file.type.startsWith("image/")) {
        return normalizeImageAttachment(file);
      }

      return {
        id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`,
        name: file.name || "attachment",
        contentType: file.type || "application/octet-stream",
        blob: file,
        previewUrl: "",
        isImage: false
      };
    }

    async function addFiles(files) {

        if (!isSupportedFile(file)) {
          appendSystem(t("fileTypeOnly"));

        try {
          attachedFiles.push(await normalizeAttachment(file));
          renderAttachments();
          appendSystem(t("fileAttached"));
        } catch {
          appendSystem(t("fileProcessFailed"));
        }
      }
    }

        return `Please answer in English. The user's question is in the context of the Microsoft Certified Trainer (MCT) Program. ${formatInstruction}${fileSuffix} User question: ${value}`;
      }
      if (currentLang === "ko") {
        return `한국어로 답변해 주세요. 사용자의 질문은 Microsoft Certified Trainer(MCT) Program 맥락의 질문입니다. ${formatInstruction}${fileSuffix} 사용자 질문: ${value}`;
      }
      if (currentLang === "ja") {
        return `日本語で回答してください。ユーザーの質問は Microsoft Certified Trainer (MCT) Program の文脈の質問です。${formatInstruction}${fileSuffix} ユーザーの質問: ${value}`;
      }
      if (currentLang === "zh") {
        return `请用简体中文回答。用户的问题是在 Microsoft Certified Trainer (MCT) Program 的上下文中提出的。${formatInstruction}${fileSuffix} 用户问题：${value}`;
      }
      return value;
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      if (!response.ok) {
        throw new Error(`Request failed: ${response.status}`);
      }
      return response.json();
    }

    function dataUrlToBlob(dataUrl) {
      const [header, data] = dataUrl.split(",");
      const contentType = header.match(/data:([^;]+)/)?.[1] || "application/octet-stream";
      const binary = atob(data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return new Blob([bytes], { type: contentType });
    }

    async function uploadFileActivity(text, file) {
      const activity = {
        type: "message",
        from: { id: USER_ID, name: USER_NAME },
        text,
        locale: LOCALE_BY_LANG[currentLang] || "en-US"
      };
      const formData = new FormData();
      formData.append("activity", new Blob([JSON.stringify(activity)], { type: "application/vnd.microsoft.activity" }));
      formData.append("file", file.blob, file.name);

      const response = await fetch(`${DIRECT_LINE_ENDPOINT}/conversations/${conversationId}/upload?userId=${encodeURIComponent(USER_ID)}`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` },
        body: formData
      });
      if (!response.ok) {
        throw new Error(`Upload failed: ${response.status}`);
      }
      return response.json();
    }

    async function startConversation() {
      setBusy(true);
      setStatus(t("statusConnecting"));
      clearInterval(pollTimer);
      watermark = "";
      seenActivityIds = new Set();
      sentTextsToIgnore = [];
      attachedFiles = [];
      renderAttachments();
      messages.replaceChildren();

      const tokenResponse = await requestJson(TOKEN_ENDPOINT);
      token = tokenResponse.token;

      const conversation = await requestJson(`${DIRECT_LINE_ENDPOINT}/conversations`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` }
      });

      conversationId = conversation.conversationId;
      streamUrl = conversation.streamUrl || "";

      appendMessage("bot", t("welcome"));
      setStatus(t("statusConnected"));
      setBusy(false);
      input.focus();
      pollTimer = setInterval(pollActivities, 1400);
    }

    async function pollActivities() {
      if (!conversationId || !token) return;

      try {
        const query = watermark ? `?watermark=${encodeURIComponent(watermark)}` : "";
        const data = await requestJson(`${DIRECT_LINE_ENDPOINT}/conversations/${conversationId}/activities${query}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        watermark = data.watermark || watermark;

        for (const activity of data.activities || []) {
          if (seenActivityIds.has(activity.id) || activity.from?.id === USER_ID) continue;
          seenActivityIds.add(activity.id);

          if (activity.type === "message" && activity.text) {
            const ignoredIndex = sentTextsToIgnore.indexOf(activity.text);
            if (ignoredIndex >= 0) {
              sentTextsToIgnore.splice(ignoredIndex, 1);
              continue;
            }
            appendMessage("bot", activity.text);
            setBusy(false);
            setStatus(t("statusConnected"));
          }
        }
      } catch (error) {
        setStatus(t("statusRefreshing"));
      }
    }

    async function sendMessage(text) {
      const value = text.trim();
      if ((!value && attachedFiles.length === 0) || !conversationId) return;
      const displayText = value || t("filePrompt");
      const agentQuestion = value || t("filePrompt");
      const agentMessage = buildAgentMessage(agentQuestion);
      const filesToSend = attachedFiles.map(({ name, contentType, blob, isImage }) => ({
        name,
        contentType,
        blob,
        isImage
      }));

      appendMessage("user", displayText);
      sentTextsToIgnore.push(agentMessage);
      input.value = "";
      attachedFiles = [];
      renderAttachments();
      setBusy(true);
      setStatus(t("statusThinking"));

      try {
        if (filesToSend.length) {
          await uploadFileActivity(agentMessage, filesToSend[0]);
        } else {
          await requestJson(`${DIRECT_LINE_ENDPOINT}/conversations/${conversationId}/activities`, {
            method: "POST",
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              type: "message",
              from: { id: USER_ID, name: USER_NAME },
              text: agentMessage,
              locale: LOCALE_BY_LANG[currentLang] || "en-US"
            })
          });
        }
      } catch (error) {
        appendSystem(t("sendFailed"));
        setBusy(false);
        setStatus(t("statusSendFailed"));
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    attachButton.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", () => {
      addFiles([...fileInput.files]);
      fileInput.value = "";
    });

    document.addEventListener("paste", (event) => {
      const imageFiles = [...(event.clipboardData?.items || [])]
        .filter((item) => item.kind === "file" && item.type.startsWith("image/"))
        .map((item) => item.getAsFile())
        .filter(Boolean);
      if (imageFiles.length) {
        event.preventDefault();
        addFiles(imageFiles);
      }
    });

    resetButton.addEventListener("click", () => {
      startConversation().catch(() => {
        appendSystem(t("restartFailed"));
        setBusy(false);
        setStatus(t("statusConnectFailed"));
      });
    });

    languageSelect.addEventListener("change", () => {
      applyLanguage(languageSelect.value);
      if (conversationId) {
        appendSystem(currentLang === "ko" ? "언어가 한국어로 변경되었습니다." : "Language changed to English.");
      }
    });

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    applyLanguage(currentLang);
    startConversation().catch(() => {
      appendSystem(t("connectFailed"));
      setBusy(false);
      setStatus(t("statusConnectFailed"));
    });
  </script>
</body>
</html>
